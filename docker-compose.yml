services:
  qdrant:
    image: qdrant/qdrant:latest
    ports: 
      - "6333:6333"
      - "6334:6334"
    volumes: 
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/readyz"]
      interval: 5s
      timeout: 3s
      retries: 5

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports: 
      - "16686:16686"
      - "4317:4317"
    environment:
      - COLLECTOR_OTLP_ENABLED=true

volumes:
  app_data:
  qdrant_data:
