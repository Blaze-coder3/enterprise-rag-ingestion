services:
  app:
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - app_data:/app/data
    environment:
      - DATABASE_URL=sqlite:////app/data/rag_pipeline.db
      - BLOB_STORAGE_PATH=/app/data/blobs
      - QDRANT_URL=http://qdrant:6333
      - JAEGER_ENDPOINT=jaeger:4317
    depends_on:
      - qdrant
      - jaeger

  qdrant:
    image: qdrant/qdrant:latest
    ports: 
      - "6333:6333"
      - "6334:6334"
    volumes: 
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/readyz"]
      interval: 5s
      timeout: 3s
      retries: 5

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports: 
      - "16686:16686"
      - "4317:4317"
    environment:
      - COLLECTOR_OTLP_ENABLED=true

volumes:
  app_data:
  qdrant_data:
